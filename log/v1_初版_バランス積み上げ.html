<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ブロックスタック</title>
<style>
  html,body{margin:0;height:100%;background:#eef1f6;overflow:hidden;font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#16181d;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:16px 24px;pointer-events:none;font-size:15px;color:#8a909b}
  #hud b{display:block;font-size:34px;font-weight:600;color:#16181d;font-variant-numeric:tabular-nums}
  #hud div:last-child{text-align:right}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.92);text-align:center;gap:12px;padding:20px}
  #overlay.hide{display:none}
  #overlay h1{margin:0;font-size:clamp(26px,5vw,40px);font-weight:600}
  #overlay p{margin:0;color:#5b616c;line-height:1.7}
  #big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums}
  button{font:inherit;font-size:18px;margin-top:8px;padding:11px 40px;border:0;border-radius:8px;color:#fff;background:#16181d;cursor:pointer}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div>たかさ<b id="sc">0</b></div><div>ベスト<b id="bs">0</b></div></div>
<div id="overlay">
  <h1 id="ttl">ブロックスタック</h1>
  <div id="big" hidden></div>
  <p id="txt">ゆれる長方形のブロックを、タップ／クリック／スペースキーで積み上げよう。<br>ズレて積むと塔の重心が傾き、台の外に出ると<b>倒れてゲームオーバー</b>。<br>ど真ん中に落とすと「PERFECT」！ どこまで高く積めるか挑戦しよう。</p>
  <button id="go">スタート</button>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

// --- 画面 ---
let W, H, dpr;
function resize(){
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

// --- 定数 ---
const BLOCK_H = 44;         // ブロックの高さ
const BASE_W = 240;         // 台（1段目）の幅
const BLOCK_W = 118;        // 積むブロックの幅（固定）
const GAP = 160;            // 塔の上からブロックが揺れる高さ
const MARGIN = 26;          // 画面端からの余白
const SPEED0 = 2.0, SPEED_STEP = 0.045, SPEED_MAX = 6.0;
const PERFECT_TOL = 5;
const DROP_MS = 130;
const SLIDE_SCREEN_Y = () => H*0.34;

// --- 状態 ---
let blocks = [];            // {x, w, level, hue}
let topY = 0;                // 現在の塔の最上面（ワールド座標, 上が負）
let camY = 0;
let falling = null;          // {x, w, y, dir, speed, phase, t0, fromY, toY}
let combo = 0, score = 0, best = 0;
let phase = 'idle';           // idle / play / dropping / collapsing / miss / over
let popups = [], shake = 0;
let collapse = null, missFall = null;
try { best = +localStorage.getItem('stack_best') || 0; } catch(e){}
$('bs').textContent = best;

function worldToScreenX(x){ return W/2 + x; }
function worldToScreenY(y){ return y + camY; }

function spawnFalling(level){
  const minX = MARGIN - W/2, maxX = W/2 - MARGIN - BLOCK_W;
  const fromLeft = Math.random() < 0.5;
  falling = {
    x: fromLeft ? minX : maxX,
    w: BLOCK_W,
    y: topY - GAP,
    dir: fromLeft ? 1 : -1,
    speed: Math.min(SPEED_MAX, SPEED0 + level*SPEED_STEP),
    phase: 'slide'
  };
}

function reset(){
  blocks = [{x:-BASE_W/2, w:BASE_W, level:0, hue:210}];
  topY = -BLOCK_H;
  camY = 0;
  combo = 0; score = 0; popups = []; shake = 0; collapse = null; missFall = null;
  setScore(0);
  spawnFalling(1);
  phase = 'play';
}
function setScore(v){ score = v; $('sc').textContent = score; }

function start(){
  $('overlay').classList.add('hide');
  reset();
}
$('go').onclick = start;

function comXAndSupport(){
  let sum = 0, wsum = 0;
  for(const b of blocks){ const c = b.x + b.w/2; sum += c*b.w; wsum += b.w; }
  const com = sum/wsum;
  const base = blocks[0];
  return {com, left: base.x, right: base.x+base.w};
}

function popup(text, x, y, col){ popups.push({text, x, y, col, t0: performance.now()}); }

function tryDrop(){
  if(phase !== 'play' || !falling || falling.phase !== 'slide') return;
  falling.phase = 'dropping';
  falling.t0 = performance.now();
  falling.fromY = falling.y;
  falling.toY = topY - BLOCK_H;
}

function landBlock(){
  const top = blocks[blocks.length-1];
  const fx = falling.x, fw = falling.w;
  const ox1 = Math.max(fx, top.x), ox2 = Math.min(fx+fw, top.x+top.w);
  if(ox2 <= ox1){
    // 完全に外れた：塔の横に落ちていく
    phase = 'miss';
    missFall = {x:fx, y:falling.toY, w:fw, vy:4, rot:0, vr:(fx < top.x ? -0.12 : 0.12), hue:top ? colorFor(blocks.length) : 0};
    falling = null;
    return;
  }
  const level = blocks.length;
  blocks.push({x:fx, w:fw, level, hue: colorFor(level)});
  topY -= BLOCK_H;

  const offset = Math.abs((fx+fw/2) - (top.x+top.w/2));
  if(offset <= PERFECT_TOL){
    combo++;
    popup(combo > 1 ? `PERFECT! ×${combo}` : 'PERFECT!', worldToScreenX(fx+fw/2), 0, '#ff7a1a');
  } else {
    combo = 0;
  }
  setScore(score+1);
  shake = Math.min(14, 4 + offset*0.12);

  const {com, left, right} = comXAndSupport();
  if(com < left || com > right){
    startCollapse(com < left ? -1 : 1);
    return;
  }
  spawnFalling(level+1);
}

function startCollapse(dir){
  phase = 'collapsing';
  const base = blocks[0];
  const pivotWorldX = dir > 0 ? base.x+base.w : base.x;
  const pivotWorldY = 0;
  const pivotScreen = {x: worldToScreenX(pivotWorldX), y: worldToScreenY(pivotWorldY)};
  const parts = blocks.map(b => {
    const cx = worldToScreenX(b.x+b.w/2), cy = worldToScreenY(-(b.level)*BLOCK_H - BLOCK_H/2);
    return {dx: cx-pivotScreen.x, dy: cy-pivotScreen.y, w:b.w, h:BLOCK_H, hue:b.hue};
  });
  collapse = {pivot: pivotScreen, parts, angle:0, angVel:0, dir};
}

function colorFor(level){ return (200 + level*22) % 360; }

function finish(){
  phase = 'over';
  const isBest = score > best;
  if(isBest){ best = score; try { localStorage.setItem('stack_best', best); } catch(e){} }
  $('bs').textContent = best;
  $('ttl').textContent = '倒れた！';
  $('big').hidden = false; $('big').textContent = score;
  $('txt').innerHTML = `たかさ ${score} 段　ベスト ${best} 段${isBest && score>0 ? '（更新！）' : ''}`;
  $('go').textContent = 'もう一度';
  $('overlay').classList.remove('hide');
}

// --- 入力 ---
function onDrop(){
  if(phase === 'play') tryDrop();
}
cv.addEventListener('pointerdown', onDrop);
addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if(!$('overlay').classList.contains('hide') && phase !== 'collapsing' && phase !== 'miss') start();
    else onDrop();
  }
});

// --- 描画 ---
function drawBlock(x, y, w, h, hue, highlight){
  const sx = worldToScreenX(x), sy = worldToScreenY(y);
  const g = ctx.createLinearGradient(sx, sy, sx, sy+h);
  g.addColorStop(0, `hsl(${hue},62%,${highlight?72:60}%)`);
  g.addColorStop(1, `hsl(${hue},62%,${highlight?58:46}%)`);
  ctx.fillStyle = g;
  ctx.strokeStyle = `hsl(${hue},40%,30%)`;
  ctx.lineWidth = 2;
  roundRect(sx, sy, w, h, 6);
  ctx.fill(); ctx.stroke();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function frame(){
  const now = performance.now();

  // カメラ追従
  const slideWorldY = topY - GAP;
  const targetCam = SLIDE_SCREEN_Y() - slideWorldY;
  camY += (targetCam - camY) * 0.12;

  // 落下中ブロックの移動
  if(falling && falling.phase === 'slide'){
    const minX = MARGIN - W/2, maxX = W/2 - MARGIN - falling.w;
    falling.x += falling.dir*falling.speed;
    if(falling.x < minX){ falling.x = minX; falling.dir = 1; }
    if(falling.x > maxX){ falling.x = maxX; falling.dir = -1; }
  }
  if(falling && falling.phase === 'dropping'){
    const t = Math.min(1, (now-falling.t0)/DROP_MS);
    falling.y = falling.fromY + (falling.toY - falling.fromY)*(t*t);
    if(t >= 1){ landBlock(); }
  }

  // 衝突後ミス落下アニメーション
  if(phase === 'miss' && missFall){
    missFall.vy += 0.9; missFall.y += missFall.vy; missFall.rot += missFall.vr;
    if(worldToScreenY(missFall.y) > H+120) finish();
  }

  // 崩壊アニメーション
  if(phase === 'collapsing' && collapse){
    collapse.angVel += 0.0022*Math.cos(collapse.angle*0.9);
    collapse.angle += collapse.angVel;
    if(collapse.angle > 1.5) finish();
  }

  // 背景
  ctx.fillStyle = '#eef1f6'; ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake > 0){ ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake); shake *= .82; if(shake < .3) shake = 0; }

  // 地面
  const groundSY = worldToScreenY(0);
  ctx.fillStyle = '#cfd6e2';
  ctx.fillRect(0, groundSY, W, Math.max(0, H-groundSY));
  ctx.fillStyle = '#9aa3b4';
  ctx.fillRect(0, groundSY, W, 3);

  if(phase === 'collapsing' && collapse){
    ctx.translate(collapse.pivot.x, collapse.pivot.y);
    ctx.rotate(collapse.angle*collapse.dir);
    for(const p of collapse.parts){
      ctx.save();
      ctx.translate(p.dx, p.dy);
      const g = ctx.createLinearGradient(0,-p.h/2,0,p.h/2);
      g.addColorStop(0, `hsl(${p.hue},62%,60%)`);
      g.addColorStop(1, `hsl(${p.hue},62%,46%)`);
      ctx.fillStyle = g; ctx.strokeStyle = `hsl(${p.hue},40%,30%)`; ctx.lineWidth = 2;
      roundRect(-p.w/2, -p.h/2, p.w, p.h, 6); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  } else {
    // 積んだブロック
    for(const b of blocks){
      const y = -(b.level)*BLOCK_H - BLOCK_H;
      drawBlock(b.x, y, b.w, BLOCK_H, b.hue, false);
    }
    // 落下中ブロック
    if(falling) drawBlock(falling.x, falling.y, falling.w, BLOCK_H, colorFor(blocks.length), true);
    // ミスで落ちるブロック
    if(phase === 'miss' && missFall){
      const sx = worldToScreenX(missFall.x)+missFall.w/2, sy = worldToScreenY(missFall.y)+BLOCK_H/2;
      ctx.save(); ctx.translate(sx,sy); ctx.rotate(missFall.rot);
      const g = ctx.createLinearGradient(0,-BLOCK_H/2,0,BLOCK_H/2);
      g.addColorStop(0, `hsl(${missFall.hue},62%,60%)`); g.addColorStop(1, `hsl(${missFall.hue},62%,46%)`);
      ctx.fillStyle = g; ctx.strokeStyle = `hsl(${missFall.hue},40%,30%)`; ctx.lineWidth = 2;
      roundRect(-missFall.w/2,-BLOCK_H/2,missFall.w,BLOCK_H,6); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();

  // ポップアップ
  ctx.textAlign = 'center';
  for(const p of popups){
    const age = now - p.t0;
    if(age > 900) continue;
    const fade = 1 - age/900;
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.translate(p.x, H*0.3 - age*0.06);
    ctx.font = '700 26px "Hiragino Sans","Yu Gothic",sans-serif';
    ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.col; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  popups = popups.filter(p => now - p.t0 <= 900);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
